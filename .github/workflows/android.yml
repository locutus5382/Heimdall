name: Heimdall native foundation

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, 'feature/**', 'fix/**']
  workflow_dispatch:

jobs:
  android:
    name: Android build and engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify no external networking permission
        run: |
          if grep -REi '<uses-permission[^>]+android.permission.INTERNET' app/src/main; then
            echo "::error::Heimdall must remain offline-only."
            exit 1
          fi
      - name: Build and run all pure engine tests
        run: gradle :engine:test :app:assembleDebug --no-daemon --stacktrace
      - name: Verify standalone Heimdall application ID
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" |
            grep -F "package: name='com.locutus5382.heimdall'"
      - name: Upload standalone debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HEIMDALL-v0.1-foundation-debug
          if-no-files-found: error
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Preserve engine test results on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heimdall-engine-test-results
          if-no-files-found: ignore
          path: |
            engine/build/test-results/test/
            engine/build/reports/tests/test/
