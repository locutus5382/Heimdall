name: Heimdall recorder quality gates

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, 'feature/**', 'fix/**']
  workflow_dispatch:

# A new hardening commit supersedes obsolete test runs for the same branch.
concurrency:
  group: heimdall-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build and engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify no external networking permission
        run: |
          if grep -REi '<uses-permission[^>]+android.permission.INTERNET' app/src/main; then
            echo "::error::Heimdall must remain offline-only."
            exit 1
          fi
      - name: Build and run all pure engine tests
        run: gradle :engine:test :app:assembleDebug --no-daemon --stacktrace
      - name: Verify standalone Heimdall application ID
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" |
            grep -F "package: name='com.locutus5382.heimdall'"
      - name: Upload standalone debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HEIMDALL-v0.3-stability-debug
          if-no-files-found: error
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Preserve engine test results on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heimdall-engine-test-results
          if-no-files-found: ignore
          path: |
            engine/build/test-results/test/
            engine/build/reports/tests/test/

  instrumentation:
    name: Android UI recorder round-trip (API 35)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android compile SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable KVM acceleration on Linux runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real dashboard to Service to SQLite acceptance test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          script: gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Preserve Android instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heimdall-android-acceptance-results
          if-no-files-found: ignore
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
