name: Heimdall recorder quality gates

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'integration/**']
  pull_request:
    branches: [main, 'feature/**', 'fix/**', 'integration/**']
  workflow_dispatch:

# A new hardening commit supersedes obsolete test runs for the same branch.
concurrency:
  group: heimdall-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build and engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and run all pure engine tests
        run: gradle :engine:test :app:assembleDebug :app:assembleLeanDebug :app:assembleRelease :app:bundleRelease :app:assembleReleaseQa --no-daemon --stacktrace
      - name: Verify R8 QA APK preserves test-linked Kotlin/coroutines ABI
        run: |
          python3 scripts/check_lean_test_abi.py \
            app/build/outputs/apk/leanDebug/app-leanDebug.apk \
            kotlin.LazyKt \
            kotlin.coroutines.intrinsics.IntrinsicsKt \
            androidx.compose.runtime.MonotonicFrameClock \
            kotlinx.coroutines.JobKt \
            kotlinx.coroutines.BuildersKt \
            kotlinx.coroutines.CoroutineScopeKt
      - name: Validate permissions in merged APK manifests (including libraries)
        run: |
          python3 scripts/check_apk_permissions.py \
            "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/leanDebug/app-leanDebug.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/releaseQa/app-releaseQa.apk
      - name: Verify Bifrost test host only in target QA variants
        run: |
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          HOST="com.locutus5382.heimdall.ui.navigation.BifrostTestActivity"
          for APK in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/leanDebug/app-leanDebug.apk; do
            "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -F "$HOST"
          done
          for APK in app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/releaseQa/app-releaseQa.apk; do
            if "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -F "$HOST"; then
              echo "Test-only Bifrost host leaked into release variant: $APK" >&2
              exit 1
            fi
          done
      - name: Verify standalone Heimdall application ID
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" |
            grep -F "package: name='com.locutus5382.heimdall'"
      - name: Record exact APK file SHA-256 and source commit
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          for flavor, apk in (
              ("debug", Path("app/build/outputs/apk/debug/app-debug.apk")),
              ("lean-debug", Path("app/build/outputs/apk/leanDebug/app-leanDebug.apk")),
          ):
              digest = hashlib.sha256(apk.read_bytes()).hexdigest()
              manifest = apk.parent / "heimdall-apk-sha256.txt"
              manifest.write_text(
                  f"source_commit={os.environ['GITHUB_SHA']}\n"
                  f"apk_filename={apk.name}\n"
                  f"apk_sha256={digest}\n"
              )
              print(f"{flavor}: {apk.name} SHA-256 {digest}")
          PY
      - name: Verify exact APK digests and checksum regression tests
        run: |
          python3 -m unittest scripts.test_verify_rc1_apk -v
          python3 scripts/verify_rc1_apk.py \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/heimdall-apk-sha256.txt \
            --commit "$GITHUB_SHA"
          python3 scripts/verify_rc1_apk.py \
            app/build/outputs/apk/leanDebug/app-leanDebug.apk \
            app/build/outputs/apk/leanDebug/heimdall-apk-sha256.txt \
            --commit "$GITHUB_SHA"
      - name: Upload standalone debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HEIMDALL-v0.8.3-duko-workbench-debug
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/heimdall-apk-sha256.txt
      - name: Measure debug, optimized QA and production-equivalent outputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = {
              "debug": Path("app/build/outputs/apk/debug/app-debug.apk"),
              "lean_qa": Path("app/build/outputs/apk/leanDebug/app-leanDebug.apk"),
              "release_unsigned": Path("app/build/outputs/apk/release/app-release-unsigned.apk"),
              "release_qa_signed": Path("app/build/outputs/apk/releaseQa/app-releaseQa.apk"),
              "release_aab_container": Path("app/build/outputs/bundle/release/app-release.aab"),
          }
          for label, path in paths.items():
              assert path.is_file(), f"Missing {label}: {path}"
          sizes = {label: path.stat().st_size for label, path in paths.items()}
          reduction = 100.0 * (1 - sizes["lean_qa"] / sizes["debug"])
          qa_delta = 100.0 * (sizes["lean_qa"] / sizes["release_qa_signed"] - 1)
          lines = [f"{label}_bytes={size}" for label, size in sizes.items()]
          lines += [
              f"lean_vs_debug_reduction_percent={reduction:.1f}",
              f"lean_vs_release_qa_delta_percent={qa_delta:+.1f}",
              "note=the AAB container size is not an estimated Play-delivered download",
              "note=release_qa is debug-signed using production R8 rules, not a production release",
          ]
          report = "\n".join(lines) + "\n"
          print(report, end="")
          Path("app/build/outputs/apk/heimdall-size-report.txt").write_text(report)
          assert sizes["lean_qa"] < sizes["debug"], "Lean QA must remain smaller than unshrunk debug"
          PY
      - name: Upload optimized installable QA APK
        uses: actions/upload-artifact@v4
        with:
          name: HEIMDALL-v0.8.3-duko-workbench-lean-debug
          if-no-files-found: error
          path: |
            app/build/outputs/apk/leanDebug/app-leanDebug.apk
            app/build/outputs/apk/leanDebug/heimdall-apk-sha256.txt
      - name: Preserve production and production-equivalent R8 evidence
        uses: actions/upload-artifact@v4
        with:
          name: heimdall-release-ci-evidence
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/releaseQa/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/mapping/releaseQa/mapping.txt
      - name: Upload APK size comparison
        uses: actions/upload-artifact@v4
        with:
          name: heimdall-apk-size-report
          if-no-files-found: error
          path: app/build/outputs/apk/heimdall-size-report.txt
      - name: Preserve engine test results on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heimdall-engine-test-results
          if-no-files-found: ignore
          path: |
            engine/build/test-results/test/
            engine/build/reports/tests/test/

  instrumentation:
    name: Android UI recorder round-trip (API 35)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android compile SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable KVM acceleration on Linux runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real dashboard to Service to SQLite acceptance test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            # Baseline unshrunk instrumentation verifies the normal developer build.
            gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace
            # Mapped to the optimized app, not a debug APK installed afterward.
            # R8 errors in Service/SQLite/reflection must fail the quality gate.
            gradle :app:connectedAndroidTest -PheimdallAndroidTestBuildType=leanDebug --no-daemon --stacktrace
            adb install -r app/build/outputs/apk/leanDebug/app-leanDebug.apk
            adb shell am force-stop com.locutus5382.heimdall
            adb shell am start -n com.locutus5382.heimdall/.ui.MainActivity
            sleep 3
            adb shell pidof com.locutus5382.heimdall
            # Test actual release R8 rules, not the test-compatible leanDebug rules.
            # Debug signing is temporary per runner: QA only, never distribute.
            gradle :app:assembleReleaseQa --no-daemon --stacktrace
            adb install -r app/build/outputs/apk/releaseQa/app-releaseQa.apk
            adb shell am force-stop com.locutus5382.heimdall
            adb shell am start -n com.locutus5382.heimdall/.ui.MainActivity
            sleep 3
            adb shell pidof com.locutus5382.heimdall
      - name: Preserve Android instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heimdall-android-acceptance-results
          if-no-files-found: ignore
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
